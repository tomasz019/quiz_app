<!DOCTYPE html>
<html lang="pl" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Odpowiedzi</title>
</head>
<body>
    <h1>Odpowiedzi do pytania</h1>
    <p th:text="${question.content}"></p>
    <p th:if="${error}" th:text="${error}"></p>

    <form th:if="${editAnswer != null}" method="post"
          th:action="@{/quizzes/{quizId}/questions/{questionId}/answers/{answerId}(
            quizId=${question.quiz.id}, questionId=${question.id}, answerId=${editAnswer.id})}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <label>
            Treść odpowiedzi:
            <input type="text" name="text" th:value="${editAnswer.text}" required>
        </label>
        <label>
            <input type="checkbox" name="isCorrect" value="true" th:checked="${editAnswer.correct}">
            Poprawna
        </label>
        <button type="submit">Zapisz zmiany</button>
    </form>

    <form th:unless="${editAnswer != null}" method="post"
          th:action="@{/quizzes/{quizId}/questions/{questionId}/answers(quizId=${question.quiz.id}, questionId=${question.id})}">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
        <div id="answer-fields">
            <div class="answer-field">
                <input type="text" name="answerTexts" placeholder="Treść odpowiedzi" required>
                <label>
                    <input type="checkbox" name="correctIndexes" value="0">
                    Poprawna
                </label>
            </div>
        </div>
        <button type="button" id="add-answer">Dodaj kolejną odpowiedź</button>
        <button type="submit">Zapisz odpowiedzi</button>
    </form>

    <h2>Istniejące odpowiedzi</h2>
    <ul>
        <li th:each="answer : ${answers}">
            <span th:text="${answer.text}"></span>
            <span th:text="${answer.correct ? ' (poprawna)' : ''}"></span>
            <a th:href="@{/quizzes/{quizId}/questions/{questionId}/answers/{answerId}/edit(
                quizId=${question.quiz.id}, questionId=${question.id}, answerId=${answer.id})}">
                Edytuj
            </a>
            <form method="post"
                  th:action="@{/quizzes/{quizId}/questions/{questionId}/answers/{answerId}/delete(
                    quizId=${question.quiz.id}, questionId=${question.id}, answerId=${answer.id})}"
                  style="display:inline">
                <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}">
                <button type="submit">Usuń</button>
            </form>
        </li>
    </ul>

    <a th:href="@{/quizzes/{quizId}/questions(quizId=${question.quiz.id})}">Powrót do pytań</a>

    <script>
        const fields = document.getElementById('answer-fields');
        const addAnswerButton = document.getElementById('add-answer');

        if (fields && addAnswerButton) {
            const refreshIndexes = () => {
                [...fields.children].forEach((row, index) => {
                    row.querySelector('input[type="checkbox"]').value = index;
                });
            };

            addAnswerButton.addEventListener('click', () => {
                const row = document.createElement('div');
                row.className = 'answer-field';
                row.innerHTML = `
                    <input type="text" name="answerTexts" placeholder="Treść odpowiedzi" required>
                    <label>
                        <input type="checkbox" name="correctIndexes">
                        Poprawna
                    </label>
                    <button type="button" class="cancel-answer">Anuluj</button>`;
                fields.appendChild(row);
                refreshIndexes();
            });

            fields.addEventListener('click', (event) => {
                if (event.target.classList.contains('cancel-answer')) {
                    event.target.closest('.answer-field').remove();
                    refreshIndexes();
                }
            });
        }
    </script>
</body>
</html>
